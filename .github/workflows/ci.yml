name: CI

# Vérifie que le site compile, sur toute branche autre que main et sur les pull requests.
# Utile quand on ajoute une nouvelle forme : on voit l'erreur avant de pousser sur main.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html manquant."; exit 1; }
          echo "Build OK — $(find dist -type f | wc -l) fichiers."

      # Les scripts de deploy/ ne tournent que sur le VPS : on les contrôle ici,
      # puisqu'ils ne peuvent pas être validés depuis un poste Windows.
      - name: Lint deploy scripts
        run: |
          shopt -s nullglob
          scripts=(deploy/**/*.sh deploy/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then echo "Aucun script à vérifier."; exit 0; fi
          for f in "${scripts[@]}"; do
            echo "--- $f"
            bash -n "$f" || { echo "::error file=$f::erreur de syntaxe bash"; exit 1; }
          done
          shellcheck --severity=warning "${scripts[@]}"
          echo "Scripts de déploiement OK."
