# Configuration Nginx pour le blog de recherche d'Ousmane Ba
# ---------------------------------------------------------------------------
# Reprise de la configuration du projet miliwal (Pulaagu / Calendrier Fulfulde),
# adaptée à ce blog : pas de service worker, et routage par hash (#/...).
#
# Installation (une seule fois, sur le VPS) :
#   sudo cp nginx.example.conf /etc/nginx/sites-available/blog.conf
#   sudo nano /etc/nginx/sites-available/blog.conf     # remplacer le domaine et root
#   sudo ln -s /etc/nginx/sites-available/blog.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# `root` doit valoir exactement la même chose que le secret VPS_PATH.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.example;

    root /var/www/blog;
    index index.html;

    # Compression des fichiers texte. Vérifier que gzip est actif dans nginx.conf.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- Cache long pour les fichiers hachés par Vite (index-XXXX.js, Theme-XXXX.js…) ----
    # Leur nom change à chaque build : on peut donc les garder un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Ne jamais mettre index.html en cache ----
    # Sinon le navigateur continue de charger les anciens fichiers après un déploiement,
    # et la nouvelle forme du blog n'apparaît pas.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---- Reste des requêtes -> index.html ----
    # Les adresses du blog sont en mode hash (/#/recherche/mon-article), donc le serveur
    # ne reçoit que « / ». Ce repli couvre malgré tout les anciens liens et les rafraîchissements.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- En-têtes de sécurité ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
}

# ---------------------------------------------------------------------------
# HTTPS (recommandé) : après que le bloc ci-dessus réponde en HTTP, lancer
#   sudo certbot --nginx -d votre-domaine.example
# Certbot réécrit ce fichier pour ajouter l'écoute 443 et la redirection 80 → 443.
# ---------------------------------------------------------------------------
