# Blog de recherche d'Ousmane Ba — bloc Nginx prêt à l'emploi
# ---------------------------------------------------------------------------
# Ce VPS héberge déjà plusieurs sites (goomufulo.com, lingoo.tech,
# tarolearning.com, miliwal, nyabinghi…). Ce fichier est conçu pour n'en
# modifier AUCUN : il ajoute un bloc serveur avec un `server_name` que personne
# n'utilise, sur le port 80 déjà ouvert dans le pare-feu.
#
# Pourquoi `blog.173-249-2-195.sslip.io` :
#   - sslip.io résout n'importe quel `<nom>.173-249-2-195.sslip.io` vers
#     173.249.2.195, sans enregistrement DNS à créer ;
#   - le bloc `academypulaar` occupe déjà `server_name 173.249.2.195` sur les
#     ports 80 et 443 : servir le blog « sur l'IP nue » obligerait à modifier
#     ce bloc, donc à risquer goomufulo.com ;
#   - les ports 8082/8083 ne passent pas le pare-feu : un port dédié
#     demanderait en plus une règle réseau.
# Le jour où le domaine est acheté : remplacer `server_name` ci-dessous,
# relancer `sudo nginx -t && sudo systemctl reload nginx`, puis certbot.
#
# Installation (une seule fois) :
#   sudo cp nginx.blog-sslip.conf /etc/nginx/sites-available/blog
#   sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le nom de fichier « blog » compte : sites-enabled est inclus par ordre
# alphabétique et le premier bloc sert de serveur par défaut en l'absence de
# `default_server`. « blog » passe après « academypulaar », qui garde donc ce rôle.
#
# `root` doit valoir exactement la même chose que le secret VPS_PATH.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name blog.173-249-2-195.sslip.io;

    root /var/www/blog;
    index index.html;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- Cache long pour les fichiers hachés par Vite (index-XXXX.js, Theme-XXXX.js…) ----
    # Leur nom change à chaque build : on peut donc les garder un an.
    #
    # Attention : dès qu'un `location` déclare un `add_header`, Nginx cesse
    # d'hériter de ceux du bloc serveur. Les en-têtes de sécurité sont donc
    # répétés dans chaque `location` qui en déclare un, sans quoi ils
    # disparaîtraient silencieusement sur ces réponses.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        try_files $uri =404;
    }

    # ---- Ne jamais mettre index.html en cache ----
    # Sinon le navigateur continue de charger les anciens fichiers après un
    # déploiement, et la nouvelle forme du blog n'apparaît pas.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # ---- Reste des requêtes -> index.html ----
    # Les adresses du blog sont en mode hash (/#/recherche/mon-article), donc le
    # serveur ne reçoit que « / ». Ce repli couvre les anciens liens et les
    # rafraîchissements.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}

# ---------------------------------------------------------------------------
# HTTPS, une fois que le bloc ci-dessus répond en HTTP :
#   sudo certbot --nginx -d blog.173-249-2-195.sslip.io
# Certbot réécrit ce fichier pour ajouter l'écoute 443 et la redirection 80 → 443.
# ---------------------------------------------------------------------------
